<svg xmlns="http://www.w3.org/2000/svg" width="390" height="560" viewBox="0 0 390 560" role="img"><rect width="100%" height="100%" fill="#f4efec"/><rect x="12" y="12" width="366" height="536" rx="18" fill="white"/><text x="32" y="55" font-family="Arial" font-size="13" fill="#585254">VALORA | ILLUSTRATIVE FRAMEWORK</text><text x="32" y="95" font-family="Georgia" font-size="23" fill="#251f21">One record for each tool</text><rect x="32" y="182" width="326" height="82" rx="8" fill="#f4efec"/><text x="48" y="210" font-family="Arial" font-size="18" font-weight="600" fill="#246450">Inputs</text><text x="48" y="232" font-family="Arial" font-size="14" fill="#251f21">Save amounts, units and date</text><rect x="32" y="282" width="326" height="82" rx="8" fill="#f4efec"/><text x="48" y="310" font-family="Arial" font-size="18" font-weight="600" fill="#246450">Assumptions</text><text x="48" y="332" font-family="Arial" font-size="14" fill="#251f21">Keep timing and rate labels</text><rect x="32" y="382" width="326" height="82" rx="8" fill="#f4efec"/><text x="48" y="410" font-family="Arial" font-size="18" font-weight="600" fill="#246450">Open decision</text><text x="48" y="432" font-family="Arial" font-size="14" fill="#251f21">Do not combine unstated models</text><text x="32" y="532" font-family="Arial" font-size="12" fill="#585254">Educational aid. Keep personal records private.</text></svg>