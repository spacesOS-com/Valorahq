<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img"><rect width="100%" height="100%" fill="#f4efec"/><rect x="12" y="12" width="1076" height="436" rx="18" fill="white"/><text x="32" y="55" font-family="Arial" font-size="13" fill="#585254">VALORA | ILLUSTRATIVE FRAMEWORK</text><text x="32" y="95" font-family="Georgia" font-size="32" fill="#251f21">Growth first, addition second</text><rect x="32" y="190" width="326" height="82" rx="8" fill="#f4efec"/><text x="48" y="218" font-family="Arial" font-size="18" font-weight="600" fill="#246450">Start of month</text><text x="48" y="240" font-family="Arial" font-size="14" fill="#251f21">$1,000 at assumed 1% monthly</text><rect x="387" y="190" width="326" height="82" rx="8" fill="#f4efec"/><text x="403" y="218" font-family="Arial" font-size="18" font-weight="600" fill="#246450">After growth</text><text x="403" y="240" font-family="Arial" font-size="14" fill="#251f21">$1,010 before the addition</text><rect x="742" y="190" width="326" height="82" rx="8" fill="#f4efec"/><text x="758" y="218" font-family="Arial" font-size="18" font-weight="600" fill="#246450">Month-end addition</text><text x="758" y="240" font-family="Arial" font-size="14" fill="#251f21">Add $100: modeled $1,110</text><text x="32" y="432" font-family="Arial" font-size="12" fill="#585254">Educational aid. Keep personal records private.</text></svg>