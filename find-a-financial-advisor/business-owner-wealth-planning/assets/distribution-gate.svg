<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><rect width="1200" height="660" fill="#f5f3ea"/><style>text{font-family:Arial,sans-serif;fill:#163b2b} .title{font-size:38px;font-weight:bold} .label{font-size:27px;font-weight:bold} .sub{font-size:23px}</style><text x="60" y="72" class="title">Review before household allocation.</text><rect x="50" y="135" width="520" height="160" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="72" y="179" class="label">1. Business commitments</text><text x="72" y="221" class="sub">Cash timing and operating needs</text><text x="72" y="255" class="sub">No universal reserve percentage</text><rect x="630" y="135" width="520" height="160" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="652" y="179" class="label">2. Access and permission</text><text x="652" y="221" class="sub">Agreements and restrictions</text><text x="652" y="255" class="sub">Check the actual documents</text><rect x="50" y="390" width="520" height="170" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="72" y="434" class="label">3. Tax review</text><text x="72" y="476" class="sub">Entity and owner facts</text><text x="72" y="510" class="sub">Not one rate times a transfer</text><rect x="630" y="390" width="520" height="170" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="652" y="434" class="label">4. Household allocation</text><text x="652" y="476" class="sub">Near-term needs and goals</text><text x="652" y="510" class="sub">Unknown items stay unapproved</text><path d="M570 215 L630 215" stroke="#9a6d4c" stroke-width="5"/><circle cx="630" cy="215" r="7" fill="#9a6d4c"/><path d="M890 295 L890 390" stroke="#9a6d4c" stroke-width="5"/><circle cx="890" cy="390" r="7" fill="#9a6d4c"/><path d="M570 475 L630 475" stroke="#9a6d4c" stroke-width="5"/><circle cx="630" cy="475" r="7" fill="#9a6d4c"/></svg>