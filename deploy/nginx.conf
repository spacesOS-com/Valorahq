# Proposed config, NOT current-host config or approved routing parity.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  access_log off;
  server {
    listen 8080;
    server_name _;
    root /srv/consumer;
    index index.html;
    location = /script.js { return 301 /assets/script.js; }
    location = /styles.css { return 301 /assets/styles.css; }
    location ~ (^|/)\. { return 404; }
    location ^~ /_build/ { return 404; }
    location ^~ /ops/ { return 404; }
    location = /candidate-build.log { return 404; }
    location = /candidate-build-sha256.json { return 404; }
    location = /vercel.json { return 404; }
    location / { try_files $uri $uri/ =404; }
  }
}
