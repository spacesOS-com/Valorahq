<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 630"><rect width="420" height="630" fill="#f5f3ea"/><rect x="15" y="20" width="390" height="180" rx="12" fill="#e0e8dc"/><text x="30" y="63" font-family="Arial" font-size="23" fill="#163b2b">Company records: cash</text><text x="30" y="92" font-family="Arial" font-size="23" fill="#163b2b">commitments, equity and</text><text x="30" y="121" font-family="Arial" font-size="23" fill="#163b2b">debt</text><rect x="15" y="220" width="390" height="180" rx="12" fill="#e0e8dc"/><text x="30" y="263" font-family="Arial" font-size="23" fill="#163b2b">Household connections:</text><text x="30" y="292" font-family="Arial" font-size="23" fill="#163b2b">owner income, interest in</text><text x="30" y="321" font-family="Arial" font-size="23" fill="#163b2b">company and guarantees</text><rect x="15" y="420" width="390" height="180" rx="12" fill="#e0e8dc"/><text x="30" y="463" font-family="Arial" font-size="23" fill="#163b2b">Shared shock: customer loss</text><text x="30" y="492" font-family="Arial" font-size="23" fill="#163b2b">can affect value, income</text><text x="30" y="521" font-family="Arial" font-size="23" fill="#163b2b">and obligations</text></svg>