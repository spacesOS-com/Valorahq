<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Leads | Valora Admin</title>
<style>
  :root{ --ink:#1c1a15; --muted:#8a857a; --line:#e8e4da; --paper:#f7f5f0; --card:#ffffff; --green:#1d3b2a; --mint:#d9f2e5; --mint-ink:#157347; --blue:#2563eb; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--paper); color:var(--ink); }
  .topbar{ background:var(--green); color:#efebe0; padding:14px 28px; display:flex; align-items:baseline; gap:14px; }
  .topbar h1{ font-size:1.05rem; font-weight:600; letter-spacing:.02em; }
  .topbar span{ font-size:.75rem; opacity:.65; }
  .wrap{ max-width:1180px; margin:28px auto; padding:0 20px; }
  table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(28,26,21,.07); }
  thead th{ text-align:left; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:14px 18px; border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th .sort{ opacity:.5; margin-left:5px; font-size:.6rem; }
  tbody td{ padding:18px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:.86rem; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .15s ease; }
  tbody tr:hover{ background:#fbfaf7; }
  .when{ color:var(--ink); white-space:nowrap; line-height:1.35; }
  .when small{ display:block; color:var(--muted); }
  .who strong{ display:block; font-size:.92rem; margin-bottom:5px; }
  .who span{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.78rem; line-height:1.7; }
  .who svg{ width:12px; height:12px; flex:none; opacity:.7; }
  .badge{ display:inline-block; background:var(--mint); color:var(--mint-ink); font-size:.72rem; font-weight:600; padding:5px 12px; border-radius:999px; white-space:nowrap; }
  .notes{ color:var(--muted); font-size:.8rem; min-width:150px; }
  .notes .placeholder{ display:flex; align-items:center; gap:6px; }
  .notes svg{ width:12px; height:12px; }
  .journey-link{ color:var(--blue); font-size:.82rem; text-decoration:none; white-space:nowrap; }
  .journey-link:hover{ text-decoration:underline; }
  .sample{ margin:14px 4px 0; font-size:.72rem; color:var(--muted); }
  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(28,26,21,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .overlay.open{ display:flex; }
  .modal{ background:#fff; border-radius:16px; width:520px; max-width:100%; max-height:84vh; overflow-y:auto; padding:26px 26px 20px; box-shadow:0 18px 50px rgba(0,0,0,.22); }
  .modal h2{ font-size:1.06rem; font-weight:600; margin-bottom:18px; padding-right:36px; }
  .modal .x{ position:absolute; top:16px; right:16px; width:30px; height:30px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:.85rem; color:var(--muted); line-height:1; }
  .modal .x:hover{ background:var(--paper); }
  .modal-wrap{ position:relative; }
  .step{ display:flex; gap:14px; }
  .step__n{ flex:none; width:22px; height:22px; border:1px solid var(--line); border-radius:50%; font-size:.7rem; color:var(--muted); display:flex; align-items:center; justify-content:center; margin-top:2px; background:#fff; }
  .step__body{ padding-bottom:6px; }
  .step__time{ font-size:.72rem; color:var(--muted); margin-bottom:2px; }
  .step__path{ font-size:.9rem; }
  .step__ev{ font-size:.72rem; font-weight:600; letter-spacing:.05em; color:var(--blue); margin-top:2px; }
  .step__conn{ width:1px; background:var(--line); margin:6px 0 6px 11px; height:26px; }
  @media (max-width:760px){ .who span{ font-size:.72rem; } td,th{ padding:12px 10px; } }
</style>
</head>
<body>
<header class="topbar"><h1>Valora &middot; Leads</h1><span>admin &middot; sample data &middot; backend pending</span></header>
<div class="wrap">
  <table id="leads">
    <thead><tr>
      <th>When <span class="sort">&#8597;</span></th>
      <th>Name <span class="sort">&#8597;</span></th>
      <th>Action</th>
      <th>Status <span class="sort">&#8597;</span></th>
      <th>Add Notes</th>
      <th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="sample">Sample rows for layout review only &mdash; not real leads. Live CRM feed wires in with the backend phase.</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal-wrap">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mjTitle">
      <button class="x" id="closeX" aria-label="Close">&#10005;</button>
      <h2 id="mjTitle">Lead Journey</h2>
      <div id="journeySteps"></div>
    </div>
  </div>
</div>

<script>
const LEADS = [
  {when:"Sep 27, 2026", time:"6:42 PM", name:"John Doe", email:"john.doe@example.com", phone:"+1 555 010 3201", company:"Acme Corp", action:"Find your advisor", status:"New Lead", notes:"",
   journey:[{t:"6:31 pm, Sep 27, 2026", p:"/find-a-financial-advisor/retirement-planning/", ev:"VIEW"},{t:"6:38 pm, Sep 27, 2026", p:"/find-your-advisor/", ev:"CLICK"},{t:"6:42 pm, Sep 27, 2026", p:"/find-your-advisor/", ev:"SUBMIT_FORM"}]},
  {when:"Sep 27, 2026", time:"4:15 PM", name:"Jane Doe", email:"jane.doe@example.com", phone:"+1 555 010 8842", company:"Jane Corp", action:"Find your advisor", status:"New Lead", notes:"",
   journey:[{t:"4:02 pm, Sep 27, 2026", p:"/find-a-financial-advisor/austin/", ev:"VIEW"},{t:"4:15 pm, Sep 27, 2026", p:"/find-your-advisor/", ev:"SUBMIT_FORM"}]},
  {when:"Sep 26, 2026", time:"11:03 AM", name:"Jim Doe", email:"jim.doe@example.com", phone:"+1 555 010 5519", company:"Jim Corp", action:"Quote request", status:"New Lead", notes:"User requested a product demo",
   journey:[{t:"10:47 am, Sep 26, 2026", p:"/calculators/roth-conversion-tax-cost/", ev:"VIEW"},{t:"11:03 am, Sep 26, 2026", p:"/#contact", ev:"SUBMIT_FORM"}]},
  {when:"Sep 25, 2026", time:"8:27 PM", name:"Jill Doe", email:"jill.doe@example.com", phone:"+1 555 010 2274", company:"Jill Corp", action:"Brochure download", status:"New Lead", notes:"User requested a product demo",
   journey:[{t:"8:11 pm, Sep 25, 2026", p:"/", ev:"VIEW"},{t:"8:27 pm, Sep 25, 2026", p:"/#contact", ev:"SUBMIT_FORM"}]},
  {when:"Sep 25, 2026", time:"2:56 PM", name:"Amy Doe", email:"amy.doe@example.com", phone:"+1 555 010 9930", company:"Amy Corp", action:"Find your advisor", status:"New Lead", notes:"",
   journey:[{t:"2:40 pm, Sep 25, 2026", p:"/find-a-financial-advisor/los-angeles/", ev:"VIEW"},{t:"2:56 pm, Sep 25, 2026", p:"/find-your-advisor/", ev:"SUBMIT_FORM"}]}
];
const ICONS = {
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  org:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M9 7h1m4 0h1M9 11h1m4 0h1"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
};
const rows = document.getElementById('rows');
LEADS.forEach((l, i) => {
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="when">' + l.when + '<small>' + l.time + '</small></td>' +
    '<td class="who"><strong>' + l.name + '</strong>' +
      '<span>' + ICONS.mail + l.email + '</span>' +
      '<span>' + ICONS.phone + l.phone + '</span>' +
      '<span>' + ICONS.org + l.company + '</span></td>' +
    '<td>' + l.action + '</td>' +
    '<td><span class="badge">' + l.status + '</span></td>' +
    '<td class="notes">' + (l.notes ? l.notes : '<span class="placeholder">' + ICONS.edit + 'Add Notes Here</span>') + '</td>' +
    '<td><a class="journey-link" href="#" data-i="' + i + '">View Journey</a></td>';
  rows.appendChild(tr);
});
const overlay = document.getElementById('overlay');
rows.addEventListener('click', e => {
  const a = e.target.closest('.journey-link'); if (!a) return;
  e.preventDefault();
  const l = LEADS[+a.dataset.i];
  document.getElementById('mjTitle').textContent = 'Lead Journey - ' + l.name;
  document.getElementById('journeySteps').innerHTML = l.journey.map((s, i) =>
    '<div class="step"><span class="step__n">' + (i+1) + '</span><div class="step__body">' +
    '<p class="step__time">' + s.t + '</p><p class="step__path">' + s.p + '</p>' +
    '<p class="step__ev">' + s.ev + '</p></div></div>' +
    (i < l.journey.length-1 ? '<div class="step__conn"></div>' : '')).join('');
  overlay.classList.add('open');
});
document.getElementById('closeX').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });
</script>
</body>
</html>
