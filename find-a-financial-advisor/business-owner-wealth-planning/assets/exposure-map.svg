<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><rect width="1200" height="660" fill="#f5f3ea"/><style>text{font-family:Arial,sans-serif;fill:#163b2b} .title{font-size:38px;font-weight:bold} .label{font-size:27px;font-weight:bold} .sub{font-size:23px}</style><text x="60" y="72" class="title">Separate records. Connected exposure.</text><rect x="60" y="130" width="455" height="165" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="82" y="174" class="label">Company</text><text x="82" y="216" class="sub">Salary and distributions</text><text x="82" y="250" class="sub">Equity value and borrowing</text><rect x="685" y="130" width="455" height="165" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="707" y="174" class="label">Household</text><text x="707" y="216" class="sub">Income and owner interest</text><text x="707" y="250" class="sub">Guarantees and goals</text><rect x="340" y="425" width="520" height="155" rx="16" fill="#e0e8dc" stroke="#708571" stroke-width="2"/><text x="362" y="469" class="label">Shared downside event</text><text x="362" y="511" class="sub">For example: losing a customer</text><text x="362" y="545" class="sub">Which records change together?</text><path d="M285 295 L420 425" stroke="#9a6d4c" stroke-width="5"/><circle cx="420" cy="425" r="7" fill="#9a6d4c"/><path d="M912 295 L790 425" stroke="#9a6d4c" stroke-width="5"/><circle cx="790" cy="425" r="7" fill="#9a6d4c"/></svg>