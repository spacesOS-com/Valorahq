<svg xmlns="http://www.w3.org/2000/svg" width="800" height="336" viewBox="0 0 800 336" role="img" aria-labelledby="title desc"><title id="title">Windfall stages: inputs</title><desc id="desc">Confirm assets: Ownership and value; Know deadlines: Accounts and property; Make a plan: Only then allocate</desc><style>.head{font:600 22px Arial,sans-serif;fill:#203d2d}.name{font:600 17px Arial,sans-serif;fill:#1d3225}.detail{font:14px Arial,sans-serif;fill:#536257}.note{font:12px Arial,sans-serif;fill:#59665c}.number{font:600 12px Arial,sans-serif;fill:#fff}</style><rect width="800" height="336" rx="16" fill="#f7f5f0"/><text x="35" y="55" class="head">Windfall stages: inputs</text><rect x="35" y="107" width="222" height="170" rx="12" fill="#ffffff" stroke="#d4d8d1"/><circle cx="63" cy="132" r="11" fill="#b46b4e"/><text x="63" y="136" text-anchor="middle" class="number">1</text><text class="name"><tspan x="52" y="172">Confirm assets</tspan></text><text class="detail"><tspan x="52" y="231">Ownership and value</tspan></text><rect x="277" y="107" width="222" height="170" rx="12" fill="#ffffff" stroke="#d4d8d1"/><circle cx="305" cy="132" r="11" fill="#b46b4e"/><text x="305" y="136" text-anchor="middle" class="number">2</text><text class="name"><tspan x="294" y="172">Know deadlines</tspan></text><text class="detail"><tspan x="294" y="231">Accounts and property</tspan></text><rect x="519" y="107" width="222" height="170" rx="12" fill="#ffffff" stroke="#d4d8d1"/><circle cx="547" cy="132" r="11" fill="#b46b4e"/><text x="547" y="136" text-anchor="middle" class="number">3</text><text class="name"><tspan x="536" y="172">Make a plan</tspan></text><text class="detail"><tspan x="536" y="231">Only then allocate</tspan></text><text x="35" y="313" class="note">Illustrative decision map, not a calculation or recommendation.</text></svg>